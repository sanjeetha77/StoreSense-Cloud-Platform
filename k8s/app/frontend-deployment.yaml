apiVersion: apps/v1
kind: Deployment
metadata:
  name: storesense-frontend
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: storesense-frontend
  template:
    metadata:
      labels:
        app: storesense-frontend
    spec:
      containers:
        - name: frontend
          image: storesense-ai-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          env:
            - name: NEXT_PUBLIC_API_URL
              value: "http://backend-service:8000"
          readinessProbe:
            httpGet:
              path: "/"
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: "/"
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
