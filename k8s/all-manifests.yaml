apiVersion: apps/v1
kind: Deployment
metadata:
  name: storesense-backend
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: storesense-backend
  template:
    metadata:
      labels:
        app: storesense-backend
    spec:
      containers:
        - name: backend
          image: storesense-backend:latest
          ports:
            - containerPort: 8000
          env:
            - name: SHOPIFY_ACCESS_TOKEN
              value: "YOUR_SHOPIFY_TOKEN"
---
apiVersion: v1
kind: Service
metadata:
  name: storesense-backend
  namespace: default
spec:
  selector:
    app: storesense-backend
  ports:
    - protocol: TCP
      port: 8000
      targetPort: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: storesense-frontend
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: storesense-frontend
  template:
    metadata:
      labels:
        app: storesense-frontend
    spec:
      containers:
        - name: frontend
          image: storesense-frontend:latest
          ports:
            - containerPort: 3000
          env:
            - name: NEXT_PUBLIC_API_URL
              value: "http://storesense-backend:8000"
---
apiVersion: v1
kind: Service
metadata:
  name: storesense-frontend
  namespace: default
spec:
  selector:
    app: storesense-frontend
  ports:
    - protocol: TCP
      port: 3000
      targetPort: 3000
