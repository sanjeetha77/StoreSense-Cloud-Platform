apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-datasource-custom
  namespace: default
  labels:
    grafana_datasource: "1"
data:
  loki-datasource-custom.yaml: |
    apiVersion: 1
    datasources:
    - name: Loki
      type: loki
      uid: loki
      access: proxy
      url: "http://loki-stack:3100"
      version: 1
      isDefault: false
      jsonData:
        derivedFields:
          - datasourceUid: tempo
            matcherRegex: '(?:\\"|")trace_id(?:\\"|"):\s*(?:\\"|")(\w+)(?:\\"|")'
            name: TraceID
            url: '$${__value.raw}'
