apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-provisioning
  namespace: default
  labels:
    grafana_dashboard: "1"

data:
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: 'StoreSense Dashboards'
        orgId: 1
        folder: 'StoreSense'
        type: file
        disableDeletion: false
        updateIntervalSeconds: 10
        options:
          path: /var/lib/grafana/dashboards
