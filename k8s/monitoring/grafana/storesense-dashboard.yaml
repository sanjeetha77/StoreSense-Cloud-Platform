apiVersion: v1
kind: ConfigMap
metadata:
  name: storesense-dashboard
  namespace: default
  labels:
    grafana_dashboard: '1'
data:
  storesense-dashboard.json: |-
    {
      "annotations": {
        "list": [
          {
            "builtIn": 1,
            "datasource": {
              "type": "grafana",
              "uid": "-- Grafana --"
            },
            "enable": true,
            "hide": true,
            "name": "Annotations & Alerts",
            "type": "dashboard"
          }
        ]
      },
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 1,
      "id": null,
      "links": [],
      "liveNow": false,
      "panels": [
        {
          "title": "Cluster CPU Usage",
          "type": "gauge",
          "id": 1,
          "gridPos": {
            "h": 8,
            "w": 6,
            "x": 0,
            "y": 0
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "expr": "sum(rate(container_cpu_usage_seconds_total{namespace=~\"$namespace\"}[5m])) / count(node_cpu_seconds_total{mode=\"idle\"}) * 100",
              "legendFormat": "CPU %",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "min": 0,
              "max": 100
            }
          }
        },
        {
          "title": "Cluster Memory Usage",
          "type": "gauge",
          "id": 2,
          "gridPos": {
            "h": 8,
            "w": 6,
            "x": 6,
            "y": 0
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "expr": "sum(container_memory_usage_bytes{namespace=~\"$namespace\"}) / sum(machine_memory_bytes) * 100",
              "legendFormat": "Mem %",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "min": 0,
              "max": 100
            }
          }
        },
        {
          "title": "Pod CPU Usage (Core-Seconds/s)",
          "type": "timeseries",
          "id": 3,
          "gridPos": {
            "h": 8,
            "w": 6,
            "x": 12,
            "y": 0
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "expr": "sum(rate(container_cpu_usage_seconds_total{namespace=~\"$namespace\", pod=~\"$pod\", container!=\"\"}[5m])) by (pod)",
              "legendFormat": "{{pod}}",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": {
                "drawStyle": "line",
                "lineInterpolation": "smooth"
              }
            }
          }
        },
        {
          "title": "Pod Memory Working Set (Bytes)",
          "type": "timeseries",
          "id": 4,
          "gridPos": {
            "h": 8,
            "w": 6,
            "x": 18,
            "y": 0
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "expr": "sum(container_memory_working_set_bytes{namespace=~\"$namespace\", pod=~\"$pod\", container!=\"\"}) by (pod)",
              "legendFormat": "{{pod}}",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "bytes",
              "custom": {
                "drawStyle": "line",
                "lineInterpolation": "smooth"
              }
            }
          }
        },
        {
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 8
          },
          "id": 5,
          "title": "Nginx Ingress & FastAPI Request Metrics",
          "type": "row"
        },
        {
          "title": "Nginx Proxy Request Throughput",
          "type": "timeseries",
          "id": 6,
          "gridPos": {
            "h": 8,
            "w": 6,
            "x": 0,
            "y": 9
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "expr": "sum(rate(nginx_http_requests_total[1m]))",
              "legendFormat": "Requests/sec",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "reqps"
            }
          }
        },
        {
          "title": "FastAPI HTTP Request Throughput",
          "type": "timeseries",
          "id": 7,
          "gridPos": {
            "h": 8,
            "w": 6,
            "x": 6,
            "y": 9
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "expr": "sum(rate(http_requests_total[1m])) by (method, path)",
              "legendFormat": "{{method}} {{path}}",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "reqps"
            }
          }
        },
        {
          "title": "FastAPI Error Rate",
          "type": "stat",
          "id": 19,
          "gridPos": {
            "h": 8,
            "w": 6,
            "x": 18,
            "y": 9
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "expr": "(sum(rate(http_requests_total{status=~\"5..\"}[5m])) or vector(0)) / sum(rate(http_requests_total[5m])) * 100",
              "legendFormat": "Error %",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "value": null,
                    "color": "green"
                  },
                  {
                    "value": 1,
                    "color": "orange"
                  },
                  {
                    "value": 5,
                    "color": "red"
                  }
                ]
              }
            }
          }
        },
        {
          "title": "FastAPI HTTP Latency (p95 / p90 / p50)",
          "type": "timeseries",
          "id": 8,
          "gridPos": {
            "h": 8,
            "w": 6,
            "x": 12,
            "y": 9
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "expr": "histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket[5m])) by (le))",
              "legendFormat": "p95 Latency",
              "refId": "A"
            },
            {
              "expr": "histogram_quantile(0.90, sum(rate(http_request_duration_seconds_bucket[5m])) by (le))",
              "legendFormat": "p90 Latency",
              "refId": "B"
            },
            {
              "expr": "histogram_quantile(0.50, sum(rate(http_request_duration_seconds_bucket[5m])) by (le))",
              "legendFormat": "p50 Latency",
              "refId": "C"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s"
            }
          }
        },
        {
          "title": "FastAPI Error Rate",
          "type": "stat",
          "id": 19,
          "gridPos": {
            "h": 8,
            "w": 6,
            "x": 18,
            "y": 9
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "expr": "(sum(rate(http_requests_total{status=~\"5..\"}[5m])) or vector(0)) / sum(rate(http_requests_total[5m])) * 100",
              "legendFormat": "Error %",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "value": null,
                    "color": "green"
                  },
                  {
                    "value": 1,
                    "color": "orange"
                  },
                  {
                    "value": 5,
                    "color": "red"
                  }
                ]
              }
            }
          }
        },
        {
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 17
          },
          "id": 9,
          "title": "AI Pipeline & LangGraph Agent Observability",
          "type": "row"
        },
        {
          "title": "LangGraph Agent Exec Latency (p95 by Agent)",
          "type": "timeseries",
          "id": 10,
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 0,
            "y": 18
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "expr": "histogram_quantile(0.95, sum(rate(storesense_agent_execution_duration_seconds_bucket{agent_name=~\"$agent\"}[5m])) by (le, agent_name))",
              "legendFormat": "{{agent_name}} (p95)",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "custom": {
                "drawStyle": "points",
                "pointSize": 5
              }
            }
          }
        },
        {
          "title": "Gemini API Client Latency (p95)",
          "type": "timeseries",
          "id": 11,
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 8,
            "y": 18
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "expr": "histogram_quantile(0.95, sum(rate(storesense_gemini_api_latency_seconds_bucket[5m])) by (le))",
              "legendFormat": "Gemini API Latency (p95)",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s"
            }
          }
        },
        {
          "title": "LLM Fallback & Fault Frequency",
          "type": "timeseries",
          "id": 12,
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 16,
            "y": 18
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "expr": "sum(rate(storesense_llm_fallback_total[5m])) by (reason)",
              "legendFormat": "Fallbacks: {{reason}}",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            }
          }
        },
        {
          "title": "Logs",
          "type": "logs",
          "id": 13,
          "gridPos": {
            "h": 10,
            "w": 24,
            "x": 0,
            "y": 26
          },
          "datasource": {
            "type": "loki",
            "uid": "loki"
          },
          "targets": [
            {
              "expr": "{namespace=~\"$namespace\"}",
              "refId": "A"
            }
          ],
          "options": {
            "showLabels": false,
            "wrapLogMessage": true,
            "enableLogDetails": true,
            "showTime": true
          }
        },
        {
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 36
          },
          "id": 14,
          "title": "Service Dependency Maps & SLO Performance Indicators",
          "type": "row"
        },
        {
          "title": "API Availability SLO (Target: >99.0%)",
          "type": "gauge",
          "id": 16,
          "gridPos": {
            "h": 6,
            "w": 6,
            "x": 12,
            "y": 37
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "expr": "(sum(rate(storesense_requests_total{http_status!~\"5..\"}[5m])) or vector(0)) / (sum(rate(storesense_requests_total[5m])) or vector(1)) * 100",
              "legendFormat": "Availability",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "min": 0,
              "max": 100,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "value": null,
                    "color": "red"
                  },
                  {
                    "value": 95,
                    "color": "orange"
                  },
                  {
                    "value": 99.0,
                    "color": "green"
                  }
                ]
              }
            }
          }
        },
        {
          "title": "Analysis Latency SLO (Target: 95% < 5.0s)",
          "type": "gauge",
          "id": 17,
          "gridPos": {
            "h": 6,
            "w": 6,
            "x": 18,
            "y": 37
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "expr": "histogram_quantile(0.95, sum(rate(storesense_pipeline_duration_seconds_bucket[5m])) by (le))",
              "legendFormat": "p95 Latency",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "min": 0,
              "max": 10,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "value": null,
                    "color": "green"
                  },
                  {
                    "value": 5.0,
                    "color": "orange"
                  },
                  {
                    "value": 8.0,
                    "color": "red"
                  }
                ]
              }
            }
          }
        },
        {
          "title": "Estimated LLM Cost (Cumulative USD)",
          "type": "stat",
          "id": 18,
          "gridPos": {
            "h": 6,
            "w": 12,
            "x": 12,
            "y": 43
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "expr": "sum(storesense_llm_cost_usd_total) or vector(0)",
              "legendFormat": "Total Cost (USD)",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "usd",
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "value": null,
                    "color": "green"
                  },
                  {
                    "value": 1.0,
                    "color": "orange"
                  },
                  {
                    "value": 5.0,
                    "color": "red"
                  }
                ]
              }
            }
          }
        }
      ],
      "refresh": "30s",
      "schemaVersion": 38,
      "style": "dark",
      "tags": [
        "storesense",
        "ai",
        "observability"
      ],
      "templating": {
        "list": [
          {
            "allValue": ".*",
            "current": {
              "selected": true,
              "text": "All",
              "value": "$__all"
            },
            "datasource": {
              "type": "prometheus",
              "uid": "prometheus"
            },
            "definition": "label_values(namespace)",
            "hide": 0,
            "includeAll": true,
            "label": "Namespace",
            "multi": true,
            "name": "namespace",
            "options": [],
            "query": "label_values(namespace)",
            "refresh": 1,
            "regex": "",
            "skipUrlSync": false,
            "sort": 1,
            "type": "query"
          },
          {
            "allValue": ".*",
            "current": {
              "selected": true,
              "text": "All",
              "value": "$__all"
            },
            "datasource": {
              "type": "prometheus",
              "uid": "prometheus"
            },
            "definition": "label_values(kube_pod_info{namespace=~\"$namespace\"}, pod)",
            "hide": 0,
            "includeAll": true,
            "label": "Pod",
            "multi": true,
            "name": "pod",
            "options": [],
            "query": "label_values(kube_pod_info{namespace=~\"$namespace\"}, pod)",
            "refresh": 1,
            "regex": "",
            "skipUrlSync": false,
            "sort": 1,
            "type": "query"
          },
          {
            "allValue": ".*",
            "current": {
              "selected": true,
              "text": "All",
              "value": "$__all"
            },
            "datasource": {
              "type": "prometheus",
              "uid": "prometheus"
            },
            "definition": "label_values(storesense_agent_execution_duration_seconds_bucket, agent_name)",
            "hide": 0,
            "includeAll": true,
            "label": "Agent",
            "multi": true,
            "name": "agent",
            "options": [],
            "query": "label_values(storesense_agent_execution_duration_seconds_bucket, agent_name)",
            "refresh": 1,
            "regex": "",
            "skipUrlSync": false,
            "sort": 1,
            "type": "query"
          }
        ]
      },
      "time": {
        "from": "now-15m",
        "to": "now"
      },
      "timepicker": {},
      "timezone": "",
      "title": "StoreSense-AI Unified Observability",
      "uid": "storesense-unified",
      "version": 1,
      "weekStart": ""
    }
